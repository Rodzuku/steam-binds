<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Копирование бинда</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1b2838;
            color: #c7d5e0;
        }
        .copy-btn {
            padding: 25px 50px;
            font-size: 24px;
            cursor: pointer;
            background-color: #66c0f4;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .copy-btn:hover { background-color: #4bafd7; }
    </style>
</head>
<body>

    <button class="copy-btn" onclick="copyAndClose()">
                Click to copy
    </button>
   <script>
function copyAndClose() {
    // Текст в кавычках исправлен
    const textToCopy = 'Unnatural: Benighted';

    navigator.clipboard.writeText(textToCopy).then(() => {
        const btn = document.querySelector('.copy-btn');
                btn.innerText = "Copied!";
                setTimeout(() => {
            window.location.href = 'https://steampowered.com';
        }, 260);
        btn.style.backgroundColor = "#5c7e10";

        
        // Автозакрытие убрали, чтобы браузер не блокировал код
    }).catch(err => {
        alert("Не удалось скопировать автоматически. Выделите текст вручную.");
    });
}
</script>


</body>
</html>
